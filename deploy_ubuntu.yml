---
- name: Standardized Proxmox LXC Provisioning
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    proxmox_api_host: "192.168.1.5"
    proxmox_node: "prox1"
    proxmox_user: "root@pam"
    proxmox_vmid: 203
    proxmox_hostname: "ubuntu-container"
    proxmox_template: "local:vztmpl/ubuntu-24.04-standard_24.04-1_amd64.tar.zst"
    template_filename: "ubuntu-24.04-standard_24.04-1_amd64.tar.zst"

  tasks:
    # 1. AUTHENTICATE TO API
    - name: Authenticate to Proxmox API
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/access/ticket"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ proxmox_user }}"
          password: "{{ proxmox_root_password }}"
        validate_certs: false
        return_content: true
      register: proxmox_auth
      no_log: true

    # 2. AUTOMATICALLY DOWNLOAD TEMPLATE IF MISSING
    - name: Ensure Template is Present on Host
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/aplinfo"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
          CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
        body_format: form-urlencoded
        body:
          node: "{{ proxmox_node }}"
          storage: "local"
          template: "{{ template_filename }}"
        validate_certs: false
        status_code: [200, 201, 500] # Ignores failure if it's already there
      register: template_download

    # 3. CREATE THE LXC CONTAINER
    - name: Create LXC container
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
          CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
        body_format: form-urlencoded
        body:
          vmid: "{{ proxmox_vmid }}"
          hostname: "{{ proxmox_hostname }}"
          ostemplate: "{{ proxmox_template }}"
          storage: "local-lvm"
          rootfs: "8"
          cores: "2"
          memory: "2048"
          net0: "name=eth0,bridge=vmbr0,ip=dhcp,type=veth"
          onboot: 1
          unprivileged: 1
        validate_certs: false
        return_content: true
        status_code: 200
      register: lxc_create
      no_log: true

    # 4. CONFIRM SUBMISSION
    - name: Display LXC creation result
      ansible.builtin.debug:
        msg: "LXC {{ proxmox_vmid }} creation request submitted successfully."

