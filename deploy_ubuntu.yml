---
- name: Standardized Proxmox LXC Provisioning
  hosts: localhost
  gather_facts: false
  vars:
    proxmox_host: "192.168.1.5"
    proxmox_user: "root@pam"

    # It's best to keep these in Semaphore environment variables
    proxmox_api_url: "https://yourdomain.local"
    proxmox_node: "prox1"
    proxmox_storage: "local"
    lxc_template_name: "ubuntu-24.04-standard_24.04-1_amd64.tar.zst"

  tasks:
    # 1. AUTHENTICATE FIRST (Using the password you fixed in Task #65)
    - name: Authenticate to Proxmox API
      ansible.builtin.uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/access/ticket"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ proxmox_user }}"
          password: "{{ proxmox_root_password }}"
        validate_certs: false
      register: proxmox_auth
      no_log: true

        # 2. DOWNLOAD TEMPLATE VIA API
- name: Check if Ubuntu 24.04 Template is Present
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/storage/{{ proxmox_storage }}/content?content=vztmpl"
    method: GET
    headers:
      CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
      Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
    validate_certs: false
    status_code: [200]
  register: template_status

- name: Download Ubuntu 24.04 Template if missing
  ansible.builtin.uri:
    url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/storage/{{ proxmox_storage }}/download-url"
    method: POST
    headers:
      CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
      Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
    body_format: form-urlencoded
    body:
      content: vztmpl
      filename: "{{ lxc_template_name }}"
      url: "http://download.proxmox.com/images/system/{{ lxc_template_name }}"
    validate_certs: false
    status_code: [200]
  when: template_status.json.data | selectattr('volid', 'search', lxc_template_name) | list | length == 0



    # 3. CREATE LXC CONTAINER (Only runs after template is verified/downloaded)
    - name: Create LXC container
      ansible.builtin.uri:
        url: "{{ proxmox_api_url }}/nodes/{{ proxmox_node }}/lxc"
        method: POST
        headers:
          CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
          Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
        body_format: json
        body:
          vmid: "{{ proxmox_lxc_id }}"
          ostemplate: "{{ proxmox_storage }}:vztmpl/{{ lxc_template_name }}"
          cores: 2
          memory: 2048
          rootfs: "local-lvm:8" # Adjust to match your thin pool storage
          networks: "name=eth0,bridge=vmbr0,ip=dhcp"
        validate_certs: false
        status_code: 200

