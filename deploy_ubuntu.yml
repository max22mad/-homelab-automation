---
- name: Standardized Proxmox LXC Provisioning
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    proxmox_api_host: "192.168.1.5"
    proxmox_node: "prox1"
    proxmox_user: "root@pam"
    proxmox_vmid: 203
    proxmox_hostname: "ubuntu-container"
    proxmox_storage: "local"
  tasks:
    # 1. AUTHENTICATE TO API
    - name: Authenticate to Proxmox API
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/access/ticket"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ proxmox_user }}"
          password: "{{ proxmox_root_password }}"
        validate_certs: false
        return_content: true
      register: proxmox_auth
      no_log: true

    # 2a. LOOK UP THE CURRENT UBUNTU 24.04 TEMPLATE NAME FROM PROXMOX'S CATALOG
    - name: Get Proxmox appliance catalog
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/aplinfo"
        method: GET
        headers:
          CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
          Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
        validate_certs: false
        status_code: [200]
      register: apl_list

    - name: Resolve exact Ubuntu 24.04 standard template filename
      ansible.builtin.set_fact:
        resolved_template: >-
          {{ (apl_list.json.data
              | selectattr('template', 'search', 'ubuntu-24.04-standard')
              | list | first).template }}

    # 2b. DOWNLOAD IT IF NOT ALREADY PRESENT
    - name: Ensure Template is Present on Host
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/aplinfo"
        method: POST
        headers:
          CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
          Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
        body_format: form-urlencoded
        body:
          storage: "{{ proxmox_storage }}"
          template: "{{ resolved_template }}"
        status_code: [200, 201, 500]
        validate_certs: false
      register: template_status

    # 3. CREATE THE LXC CONTAINER
    - name: Create LXC container
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/lxc"
        method: POST
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
          CSRFPreventionToken: "{{ proxmox_auth.json.data.CSRFPreventionToken }}"
        body_format: form-urlencoded
        body:
          vmid: "{{ proxmox_vmid }}"
          hostname: "{{ proxmox_hostname }}"
          ostemplate: "{{ proxmox_storage }}:vztmpl/{{ resolved_template }}"
          storage: "local-lvm"
          rootfs: "8"
          cores: "2"
          memory: "2048"
          net0: "name=eth0,bridge=vmbr0,ip=dhcp,type=veth"
          onboot: 1
          unprivileged: 1
        validate_certs: false
        return_content: true
        status_code: 200
      register: lxc_create
      no_log: true

    # 3b. WAIT FOR THE ASYNC CREATION TASK TO ACTUALLY FINISH
    - name: Wait for LXC creation task to complete
      ansible.builtin.uri:
        url: "https://{{ proxmox_api_host }}:8006/api2/json/nodes/{{ proxmox_node }}/tasks/{{ lxc_create.json.data }}/status"
        method: GET
        headers:
          Cookie: "PVEAuthCookie={{ proxmox_auth.json.data.ticket }}"
        validate_certs: false
      register: task_result
      until: task_result.json.data.status == "stopped"
      retries: 20
      delay: 3

    - name: Fail if LXC creation task errored
      ansible.builtin.fail:
        msg: "LXC creation failed: {{ task_result.json.data.exitstatus }}"
      when: task_result.json.data.exitstatus != "OK"

    # 4. CONFIRM SUBMISSION
    - name: Display LXC creation result
      ansible.builtin.debug:
        msg: "LXC {{ proxmox_vmid }} created and running successfully."
